name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui --skip-manifest-update
      - name: Verify and package
        shell: pwsh
        run: ./.ci/Build.ps1
      - name: Verify pinned host integration
        shell: pwsh
        run: ./.ci/Verify-Host.ps1
      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Quantum.Zju.Plugin.Cas-${{ runner.os }}
          path: |
            artifacts/*/*.zip
            artifacts/*/release-metadata-*.json
            artifacts/*/SHA256SUMS-*.txt
            artifacts/*/sbom-*.spdx.json
            artifacts/*/provenance-*.json
          if-no-files-found: error
